services:
  needle-in-haystack:
    build:
      context: ./experiments/needle-in-haystack
    image: tg-experiments/needle-in-haystack
    volumes:
      - ./experiments/needle-in-haystack/results:/app/results

  llm-anonym:
    build:
      context: ./experiments/llm-anonym
    image: tg-experiments/llm-anonym
    volumes:
      - ./experiments/llm-anonym/out:/app/out
